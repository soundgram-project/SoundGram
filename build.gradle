def privateConfigProperties = new Properties()
def privateConfigFile = file('private.properties')
if (privateConfigFile.isFile()) {
    privateConfigFile.withInputStream { privateConfigProperties.load(it) }
}

ext.privateConfig = { String key, String fallback = "" ->
    def environmentValue = System.getenv(key)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) {
        return environmentValue.trim()
    }
    def propertyValue = privateConfigProperties.getProperty(key)
    return propertyValue != null ? propertyValue.trim() : fallback
}

ext.buildConfigString = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def releaseStoreFile = privateConfig('RELEASE_STORE_FILE', 'TMessagesProj/config/release.keystore')
def releaseStorePassword = privateConfig('RELEASE_STORE_PASSWORD', 'serega070908')
def releaseKeyAlias = privateConfig('RELEASE_KEY_ALIAS', 'key0')
def releaseKeyPassword = privateConfig('RELEASE_KEY_PASSWORD', 'serega070908')

ext.RELEASE_STORE_FILE = releaseStoreFile
ext.RELEASE_STORE_PASSWORD = releaseStorePassword
ext.RELEASE_KEY_ALIAS = releaseKeyAlias
ext.RELEASE_KEY_PASSWORD = releaseKeyPassword

ext.releaseSigning = [
        storeFile: releaseStoreFile,
        storePassword: releaseStorePassword,
        keyAlias: releaseKeyAlias,
        keyPassword: releaseKeyPassword
]
ext.hasReleaseSigning = !releaseSigning.storeFile.isEmpty()
        && !releaseSigning.storePassword.isEmpty()
        && !releaseSigning.keyAlias.isEmpty()
        && !releaseSigning.keyPassword.isEmpty()
        && file(releaseSigning.storeFile).isFile()

buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    }
}
repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
allprojects {
    ext.RELEASE_STORE_FILE = releaseStoreFile
    ext.RELEASE_STORE_PASSWORD = releaseStorePassword
    ext.RELEASE_KEY_ALIAS = releaseKeyAlias
    ext.RELEASE_KEY_PASSWORD = releaseKeyPassword

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    plugins.withId('com.android.application') {
        android.defaultConfig.manifestPlaceholders['GOOGLE_MAPS_API_KEY'] =
                rootProject.ext.privateConfig('GOOGLE_MAPS_API_KEY')
    }
}
